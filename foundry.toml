[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
evm_version = "prague"
optimizer = true
optimizer_runs = 200
via_ir = false
# Monad execution environment (gas model, opcode pricing, precompiles incl. P256 at 0x0100).
# Requires Foundry >= 1.8.0. See https://docs.monad.xyz/tooling-and-infra/toolkits/foundry
network = "monad"
fs_permissions = [{ access = "read-write", path = "./deploy" }]

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"

[rpc_endpoints]
monad_testnet = "${MONAD_TESTNET_RPC}"
monad_mainnet = "https://rpc.monad.xyz"

[etherscan]
# Monadscan (Etherscan-compatible) verification; key optional for testnet source verification via Sourcify.
monad_testnet = { key = "${MONADSCAN_API_KEY}", chain = 10143, url = "https://api-testnet.monadscan.com/api" }
