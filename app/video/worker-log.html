<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>agentfromzero worker · live log</title>
<style>
  body { margin: 0; background: #0b0b10; color: #d9d9e3; font: 15px/1.5 ui-monospace, Consolas, monospace; }
  .bar { display: flex; align-items: center; gap: 8px; padding: 10px 16px; background: #17171f; border-bottom: 1px solid #2a2a37; }
  .bar i { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
  .bar b { margin-left: 10px; font-family: system-ui, sans-serif; font-weight: 600; }
  .bar span { color: #8e8ea0; font-family: system-ui, sans-serif; font-size: 13px; margin-left: auto; }
  .head { padding: 14px 18px 4px; color: #8e8ea0; }
  .head .cmd { color: #9dd89d; }
  #log { padding: 6px 18px 30px; }
  .l { display: grid; grid-template-columns: 92px 58px 1fr; gap: 12px; padding: 3px 0; animation: in .5s ease-out; }
  @keyframes in { from { background: rgba(143,123,255,.25); } to { background: transparent; } }
  .t { color: #6f6f80; } .info { color: #6fb3ff; } .warn { color: #f5b84b; } .error { color: #ff6b6b; }
  .m { color: #fff; font-weight: 700; } .k { color: #8e8ea0; } .v { color: #c9b8ff; }
  .cursor { display: inline-block; width: 9px; height: 17px; background: #d9d9e3; vertical-align: -3px; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
</style>
</head>
<body>
<div class="bar"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i><b>agentfromzero worker</b><span id="src">live log</span></div>
<div class="head"><span class="cmd">$ node worker/src/main.ts</span> &nbsp;# ERC-8004 agent 1908 · watches JobEscrow on Monad testnet · skill: scorecard</div>
<div id="log"></div>
<div style="padding:0 18px"><span class="cursor"></span></div>
<script>
// Tails the real worker log (JSON lines) through the recorder's local server: GET /log?since=<byte offset>.
let since = Number(new URLSearchParams(location.search).get("since") || 0);
const short = (v) => typeof v === "string" && /^0x[0-9a-fA-F]{40,}$/.test(v) ? v.slice(0, 10) + "…" + v.slice(-6) : typeof v === "object" ? JSON.stringify(v).slice(0, 60) : String(v);
const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]);
function add(line) {
  let j;
  try { j = JSON.parse(line); } catch { return; }
  const { t, level, msg, ...rest } = j;
  const kv = Object.entries(rest).filter(([k]) => k !== "jobs").map(([k, v]) => `<span class="k">${esc(k)}=</span><span class="v">${esc(short(v))}</span>`).join(" ");
  const el = document.createElement("div");
  el.className = "l";
  el.innerHTML = `<span class="t">${esc((t || "").slice(11, 19))}Z</span><span class="${esc(level)}">${esc(level)}</span><span><span class="m">${esc(msg)}</span> ${kv}</span>`;
  document.getElementById("log").appendChild(el);
  window.scrollTo(0, document.body.scrollHeight);
}
async function poll() {
  try {
    const r = await fetch(`/log?since=${since}`, { cache: "no-store" });
    const d = await r.json();
    document.getElementById("src").textContent = d.file;
    d.lines.forEach(add);
    since = d.next;
  } catch {}
  setTimeout(poll, 700);
}
poll();
</script>
</body>
</html>
